dataset:
  data_dir: "data/chest_xray"
  img_size: 224
  batch_size: 32
  num_workers: 2

model:
  name: "efficientnet_b0"
  pretrained: true
  num_classes: 1
  dropout_rate: 0.2

training:
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  pos_weight: 0.346  # num_normal (1341) / num_pneumonia (3875) to balance BCE loss
  patience: 3
  checkpoint_dir: "weights"
  checkpoint_name: "best_model.pth"

evaluation:
  metrics_output: "docs/training_metrics.json"
